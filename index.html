<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ليلة الألعاب</title>
<meta name="description" content="منصة ألعاب عائلية بالعربي - تريفيا، سباق سيارات، سلم وثعبان، شطرنج، إكس أو، سيكونس">
<meta name="theme-color" content="#a8452c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ليلة الألعاب">
<meta property="og:title" content="ليلة الألعاب">
<meta property="og:description" content="٩ ألعاب عربية - العبوا سوا من أي جوال">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>

  :root {
    --bg: oklch(97% 0.025 75);
    --blob-1: oklch(88% 0.07 70);
    --blob-2: oklch(85% 0.09 40);
    --surface: oklch(99% 0.01 80);
    --surface-border: oklch(89% 0.03 60);
    --text: oklch(25% 0.03 50);
    --text-muted: oklch(48% 0.05 50);
    --accent: oklch(70% 0.15 50);
    --accent-strong: oklch(55% 0.16 40);
    --accent-contrast: oklch(99% 0.01 80);
    --ans-a: oklch(70% 0.15 50);
    --ans-b: oklch(65% 0.18 25);
    --ans-c: oklch(60% 0.10 130);
    --ans-d: oklch(62% 0.10 250);
    --success: oklch(60% 0.14 145);
    --danger: oklch(58% 0.19 25);
    --shadow-color: oklch(55% 0.08 50 / 0.16);
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 11px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(19% 0.02 50);
      --blob-1: oklch(30% 0.05 60 / 0.55);
      --blob-2: oklch(27% 0.06 30 / 0.5);
      --surface: oklch(25% 0.02 55);
      --surface-border: oklch(34% 0.03 55);
      --text: oklch(93% 0.015 70);
      --text-muted: oklch(72% 0.03 60);
      --accent: oklch(74% 0.15 50);
      --accent-strong: oklch(82% 0.13 46);
      --accent-contrast: oklch(15% 0.02 50);
      --ans-a: oklch(66% 0.15 50);
      --ans-b: oklch(60% 0.18 25);
      --ans-c: oklch(56% 0.10 130);
      --ans-d: oklch(58% 0.10 250);
      --success: oklch(62% 0.15 145);
      --danger: oklch(62% 0.19 25);
      --shadow-color: oklch(0% 0 0 / 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(19% 0.02 50);
    --blob-1: oklch(30% 0.05 60 / 0.55);
    --blob-2: oklch(27% 0.06 30 / 0.5);
    --surface: oklch(25% 0.02 55);
    --surface-border: oklch(34% 0.03 55);
    --text: oklch(93% 0.015 70);
    --text-muted: oklch(72% 0.03 60);
    --accent: oklch(74% 0.15 50);
    --accent-strong: oklch(82% 0.13 46);
    --accent-contrast: oklch(15% 0.02 50);
    --ans-a: oklch(66% 0.15 50);
    --ans-b: oklch(60% 0.18 25);
    --ans-c: oklch(56% 0.10 130);
    --ans-d: oklch(58% 0.10 250);
    --success: oklch(62% 0.15 145);
    --danger: oklch(62% 0.19 25);
    --shadow-color: oklch(0% 0 0 / 0.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', system-ui, sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }
  body::before { top: -110px; right: -90px; width: 300px; height: 300px; background: var(--blob-1); opacity: .6; }
  body::after { bottom: -120px; left: -100px; width: 320px; height: 320px; background: var(--blob-2); opacity: .5; }

  a { color: var(--accent-strong); }
  a:hover { color: var(--accent); }

  #app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 18px 18px 34px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 11px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-name {
    font-family: 'Lalezar', system-ui, sans-serif;
    font-size: 19px;
    color: var(--text);
    letter-spacing: .2px;
  }
  .icon-btn {
    all: unset;
    cursor: pointer;
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    color: var(--text-muted);
  }
  .icon-btn:focus-visible, button:focus-visible, .answer-btn:focus-visible {
    outline: 2.5px solid var(--accent-strong);
    outline-offset: 2px;
  }

  h1, h2, h3 { text-wrap: balance; margin: 0; }

  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 22px 20px;
    box-shadow: 0 10px 24px var(--shadow-color);
  }

  .hero {
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
    padding: 10px 4px 4px;
  }
  .hero-mark {
    width: 68px; height: 68px; border-radius: 22px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 22px var(--shadow-color);
  }
  .hero-title { font-family: 'Lalezar', system-ui, sans-serif; font-size: 32px; margin-top: 4px; }
  .hero-sub { color: var(--text-muted); font-size: 14px; font-weight: 500; }

  .section-label {
    font-size: 13px; font-weight: 800; color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 10px;
  }

  .field {
    display: flex; gap: 8px;
  }
  .text-input {
    flex: 1;
    background: var(--bg);
    border: 2px solid var(--surface-border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
  }
  .text-input:focus-visible { outline: 2.5px solid var(--accent-strong); outline-offset: 1px; }
  .text-input::placeholder { color: var(--text-muted); }

  .btn {
    all: unset;
    cursor: pointer;
    box-sizing: border-box;
    text-align: center;
    font-family: inherit;
    font-weight: 800;
    border-radius: var(--radius-sm);
    padding: 12px 18px;
    font-size: 15px;
  }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-contrast);
    box-shadow: 0 8px 16px var(--shadow-color);
  }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    color: var(--accent-strong);
    border: 2px solid var(--surface-border);
  }
  .btn-block { display: block; width: 100%; padding: 16px; font-size: 17px; }

  .player-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .player-chip {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
  }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: var(--accent-contrast); font-size: 14px;
    flex-shrink: 0;
  }
  .player-chip .name { flex: 1; font-weight: 700; font-size: 14.5px; }
  .remove-btn {
    all: unset; cursor: pointer; color: var(--text-muted);
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .remove-btn:hover { background: var(--surface-border); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice-chip {
    all: unset; cursor: pointer; font-family: inherit;
    padding: 9px 15px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
    border: 2px solid var(--surface-border); color: var(--text-muted);
  }
  .choice-chip[data-on="1"] {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-contrast);
  }

  .num-row { display: flex; gap: 8px; }
  .num-btn {
    all: unset; cursor: pointer; font-family: inherit;
    flex: 1; text-align: center; padding: 10px; border-radius: var(--radius-sm);
    border: 2px solid var(--surface-border); font-weight: 800; color: var(--text-muted);
  }
  .num-btn[data-on="1"] { border-color: var(--accent); background: var(--accent); color: var(--accent-contrast); }

  details.custom-q { margin-top: 4px; }
  details.custom-q summary {
    cursor: pointer; font-weight: 800; font-size: 13.5px; color: var(--accent-strong);
    list-style: none; display: flex; align-items: center; gap: 6px;
  }
  details.custom-q summary::-webkit-details-marker { display: none; }
  .custom-form { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .opt-row { display: flex; align-items: center; gap: 8px; }
  .opt-row input[type="radio"] { accent-color: var(--accent-strong); width: 18px; height: 18px; flex-shrink: 0; }
  .custom-q-item {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; font-weight: 600;
  }
  .custom-q-item span { flex: 1; }

  .warn { color: var(--danger); font-size: 13px; font-weight: 700; text-align: center; min-height: 18px; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: var(--accent-contrast);
    padding: 8px 14px; border-radius: 999px; font-weight: 800; font-size: 13px;
  }
  .qmeta { display: flex; align-items: center; justify-content: space-between; }
  .qcount { font-weight: 700; font-size: 13.5px; color: var(--text-muted); }

  .turn-strip {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border-radius: var(--radius-md); padding: 10px 14px;
    box-shadow: 0 6px 14px var(--shadow-color);
  }
  .turn-strip .label { font-size: 12px; color: var(--text-muted); font-weight: 700; }
  .turn-strip .pname { font-weight: 800; font-size: 15px; }

  .timer-wrap { display: flex; justify-content: center; }
  .timer-num {
    font-family: 'Lalezar', system-ui, sans-serif; font-size: 26px; fill: var(--accent-strong);
  }

  .question-card {
    text-align: center; padding: 30px 22px;
  }
  .question-text {
    font-family: 'Lalezar', system-ui, sans-serif;
    font-size: 22px; line-height: 1.6; color: var(--text);
  }

  .answers-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px;
  }
  .answer-btn {
    all: unset; cursor: pointer; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--accent-contrast);
    border-radius: var(--radius-md);
    padding: 20px 10px; min-height: 64px;
    font-weight: 800; font-size: 16px;
    box-shadow: 0 6px 14px var(--shadow-color);
    transition: transform .12s ease, opacity .12s ease;
    position: relative;
  }
  .answer-btn:active { transform: scale(.97); }
  .answer-btn[data-dim="1"] { opacity: .38; }
  .answer-btn[data-correct="1"] { box-shadow: 0 0 0 4px var(--success) inset, 0 6px 14px var(--shadow-color); }
  .answer-btn[data-wrong="1"] { box-shadow: 0 0 0 4px var(--danger) inset, 0 6px 14px var(--shadow-color); }
  .answer-btn:disabled { cursor: default; }

  .scorebar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .score-pill {
    flex-shrink: 0; display: flex; align-items: center; gap: 7px;
    background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 6px;
    box-shadow: 0 4px 10px var(--shadow-color);
  }
  .score-pill[data-turn="1"] { box-shadow: 0 0 0 2px var(--accent), 0 4px 10px var(--shadow-color); }
  .score-pill .avatar { width: 24px; height: 24px; font-size: 11px; }
  .score-pill .pn { font-size: 12.5px; font-weight: 700; }
  .score-pill .ps { font-size: 12.5px; font-weight: 800; color: var(--accent-strong); }

  .reveal-banner {
    text-align: center; font-weight: 800; font-size: 17px; border-radius: var(--radius-md);
    padding: 14px; margin-top: 2px;
  }
  .reveal-banner[data-ok="1"] { background: color-mix(in oklch, var(--success) 22%, var(--surface)); color: var(--success); }
  .reveal-banner[data-ok="0"] { background: color-mix(in oklch, var(--danger) 20%, var(--surface)); color: var(--danger); }

  .rank-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border-radius: var(--radius-md); padding: 12px 16px;
    box-shadow: 0 6px 14px var(--shadow-color);
  }
  .rank-row[data-lead="1"] { box-shadow: 0 0 0 2px var(--accent), 0 8px 18px var(--shadow-color); }
  .rank-num { width: 22px; text-align: center; font-weight: 800; color: var(--text-muted); font-size: 15px; }
  .rank-row .name { flex: 1; font-weight: 700; font-size: 15px; }
  .rank-row .pts { font-family: 'Lalezar', system-ui, sans-serif; font-size: 18px; color: var(--accent-strong); }

  .winner-name { font-family: 'Lalezar', system-ui, sans-serif; font-size: 44px; text-align: center; line-height: 1.1; }
  .winner-pts { font-family: 'Lalezar', system-ui, sans-serif; font-size: 22px; text-align: center; color: var(--accent-strong); }
  #confetti { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  .footnote { text-align: center; font-size: 12px; color: var(--text-muted); }

  .mode-toggle { display: flex; gap: 8px; margin-bottom: 12px; }

  .game-progress { height: 6px; border-radius: 999px; background: var(--surface-border); overflow: hidden; }
  .game-progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }

  .power-row { display: flex; gap: 10px; justify-content: center; }
  .power-btn {
    all: unset; cursor: pointer; box-sizing: border-box;
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 2px solid var(--surface-border);
    border-radius: 999px; padding: 8px 16px; font-weight: 800; font-size: 13px;
    color: var(--accent-strong); font-family: inherit;
  }
  .power-btn[data-used="1"] { opacity: .35; cursor: not-allowed; border-style: dashed; }
  .power-btn[data-active="1"] { border-color: var(--accent); background: color-mix(in oklch, var(--accent) 18%, var(--surface)); }

  .streak-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: color-mix(in oklch, var(--danger) 18%, var(--surface)); color: var(--danger);
    border-radius: 999px; padding: 4px 10px; font-weight: 800; font-size: 12px;
  }

  .answer-btn[data-hidden="1"] { opacity: .16; filter: grayscale(1); pointer-events: none; }

  @keyframes pulseCorrect {
    0%, 100% { box-shadow: 0 0 0 4px var(--success) inset, 0 6px 14px var(--shadow-color); }
    50% { box-shadow: 0 0 0 9px var(--success) inset, 0 10px 22px var(--shadow-color); }
  }
  .answer-btn[data-correct="1"] { animation: pulseCorrect .8s ease; }

  .stats-row { display: flex; gap: 10px; }
  .stat-tile {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--surface); border-radius: var(--radius-md); padding: 14px 8px;
    box-shadow: 0 6px 14px var(--shadow-color); flex: 1; text-align: center;
  }
  .stat-tile .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 700; }
  .stat-tile .stat-value { font-family: 'Lalezar', system-ui, sans-serif; font-size: 17px; color: var(--accent-strong); }
  .stat-tile .stat-name { font-size: 12px; font-weight: 700; color: var(--text); }

  .hof-row { display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; }
  .hof-row .hof-rank { width: 20px; text-align: center; font-weight: 800; color: var(--text-muted); }
  .hof-row .hof-name { flex: 1; font-weight: 700; }
  .hof-row .hof-score { font-weight: 800; color: var(--accent-strong); font-family: 'Lalezar', system-ui, sans-serif; }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  #app.fade-in { animation: fadeInUp .28s ease; }

  .modal-backdrop {
    position: fixed; inset: 0; background: oklch(20% 0.02 50 / 0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 20; padding: 20px;
  }
  .modal-card {
    background: var(--surface); border-radius: var(--radius-lg);
    padding: 22px; max-width: 380px; width: 100%;
    box-shadow: 0 20px 40px var(--shadow-color);
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .modal-title { font-family: 'Lalezar', system-ui, sans-serif; font-size: 20px; }
  .modal-text { font-size: 13.5px; line-height: 1.7; color: var(--text-muted); margin: 0 0 10px; }
  .modal-text strong { color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    .answer-btn, * { transition: none !important; animation: none !important; }
  }

  /* ---------- board games ---------- */
  .dice-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px 0; }
  .dice-face {
    width: 56px; height: 56px; border-radius: 14px; background: var(--surface);
    border: 2px solid var(--surface-border); display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; color: var(--accent-strong);
  }

  .sl-wrap {
    background: var(--surface); border-radius: var(--radius-md); padding: 8px;
    box-shadow: 0 8px 18px var(--shadow-color); margin: 8px 0;
  }
  .sl-svg { display: block; width: 100%; height: auto; border-radius: 10px; }
  .sl-token-g { transition: transform .13s linear; }
  @keyframes tokenPop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.22); } }
  .sl-token-active { animation: tokenPop .5s ease infinite; transform-box: fill-box; transform-origin: center; }

  .dice-3d {
    width: 62px; height: 62px; border-radius: 15px;
    background: linear-gradient(145deg, #fffdf8, #efe7db);
    border: 2px solid var(--surface-border);
    box-shadow: 0 6px 14px var(--shadow-color), inset 0 -3px 6px rgba(0,0,0,.08);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 9px; gap: 2px; flex-shrink: 0;
  }
  .dice-3d span { width: 10px; height: 10px; border-radius: 50%; background: #a8452c; align-self: center; justify-self: center; }
  @keyframes diceShake { 0%,100% { transform: rotate(-9deg) translateY(0); } 50% { transform: rotate(9deg) translateY(-5px); } }
  .dice-3d[data-rolling="1"] { animation: diceShake .16s ease-in-out infinite; }

  .xo-board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 12px auto;
    position: relative;
  }
  .xo-cell {
    aspect-ratio: 1; background: var(--surface); border: 2px solid var(--surface-border); border-radius: 16px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 5px 12px var(--shadow-color); transition: transform .12s ease, background .12s ease;
    padding: 12px;
  }
  .xo-cell:active { transform: scale(.95); }
  .xo-cell[data-empty="1"]:hover { background: color-mix(in oklch, var(--accent) 10%, var(--surface)); }
  .xo-cell[data-win="1"] { background: color-mix(in oklch, var(--accent) 26%, var(--surface)); border-color: var(--accent); }
  .xo-mark { width: 100%; height: 100%; display: block; overflow: visible; }
  .xo-mark path, .xo-mark circle, .xo-mark line { stroke-linecap: round; fill: none; }
  @keyframes drawMark { from { stroke-dashoffset: var(--dash); } to { stroke-dashoffset: 0; } }
  .xo-draw { stroke-dasharray: var(--dash); animation: drawMark .28s ease forwards; }

  /* --- سباق السيارات --- */
  .race-stage { position: relative; border-radius: var(--radius-md); overflow: hidden; box-shadow: 0 10px 22px var(--shadow-color); background: #2f3a2c; }
  .race-canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .race-hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 12px; pointer-events: none; gap: 8px;
  }
  .race-hud-box {
    background: rgba(15,15,15,.55); color: #fff; border-radius: 10px; padding: 5px 10px;
    font-size: 12px; font-weight: 800; backdrop-filter: blur(3px); line-height: 1.5; text-align: center;
  }
  .race-hud-box b { font-family: 'Lalezar', system-ui, sans-serif; font-size: 17px; display: block; font-weight: 400; }
  .race-controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .race-btn {
    all: unset; box-sizing: border-box; cursor: pointer; user-select: none; -webkit-user-select: none;
    text-align: center; font-family: inherit; font-weight: 800; font-size: 13px;
    background: var(--surface); border: 2px solid var(--surface-border); border-radius: var(--radius-sm);
    padding: 14px 4px; color: var(--text); touch-action: none;
    box-shadow: 0 4px 10px var(--shadow-color); transition: transform .08s ease, background .08s ease;
  }
  .race-btn span { display: block; font-size: 20px; margin-bottom: 2px; }
  .race-btn[data-on="1"] { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); transform: scale(.94); }
  .race-btn[data-kind="gas"][data-on="1"] { background: var(--success); border-color: var(--success); color: #fff; }
  .race-btn[data-kind="brake"][data-on="1"] { background: var(--danger); border-color: var(--danger); color: #fff; }
  .race-keyhint { text-align: center; font-size: 11.5px; color: var(--text-muted); margin-top: 8px; font-weight: 600; }

  .seq-board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; background: var(--surface-border); border-radius: 10px; overflow: hidden; margin: 10px 0; }
  .seq-cell {
    aspect-ratio: 1; background: var(--surface); display: flex; align-items: center; justify-content: center;
    position: relative; font-size: 8.5px; font-weight: 800; cursor: pointer; color: var(--text);
  }
  .seq-cell[data-free="1"] { background: color-mix(in oklch, var(--accent) 22%, var(--surface)); font-size: 13px; }
  .seq-chip { position: absolute; inset: 3px; border-radius: 50%; opacity: .9; }
  .seq-chip[data-locked="1"] { box-shadow: 0 0 0 2px gold inset; }
  .seq-red { color: oklch(55% 0.18 25); }

  .chess-board {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; border-radius: 10px;
    overflow: hidden; border: 3px solid var(--surface-border); margin: 10px 0;
  }
  .chess-sq { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; background: var(--surface); }
  .chess-sq[data-dark="1"] { background: var(--bg); }
  .chess-sq[data-sel="1"] { box-shadow: inset 0 0 0 3px var(--accent-strong); }
  .chess-sq[data-tgt="1"] { box-shadow: inset 0 0 0 3px var(--accent); }
  .chess-piece[data-color="w"] { color: #f7f5ef; text-shadow: 0 0 1px #000, 0 0 2px #000; }
  .chess-piece[data-color="b"] { color: #171412; }

  function generateMathQuestions(count, rng) {
    var ops = ["+", "-", "×"];
    var out = [];
    for (var i = 0; i < count; i++) {
      var level = Math.floor(rng() * 3);
      var max = level === 0 ? 20 : (level === 1 ? 60 : 12);
      var op = level === 2 ? "×" : ops[Math.floor(rng() * 2)];
      var a = 1 + Math.floor(rng() * max);
      var b = 1 + Math.floor(rng() * max);
      var correct, text;
      if (op === "+") { correct = a + b; text = a + " + " + b + " = ؟"; }
      else if (op === "-") { if (b > a) { var tmp = a; a = b; b = tmp; } correct = a - b; text = a + " − " + b + " = ؟"; }
      else { correct = a * b; text = a + " × " + b + " = ؟"; }
      var opts = [correct];
      while (opts.length < 4) {
        var delta = 1 + Math.floor(rng() * (op === "×" ? Math.max(4, Math.round(correct * 0.2)) : 8));
        var cand = rng() < 0.5 ? correct - delta : correct + delta;
        if (cand >= 0 && opts.indexOf(cand) === -1) opts.push(cand);
      }
      var shuffled = shuffleWithRng(opts, rng);
      out.push({
        id: "m" + i + "_" + correct + "_" + shuffled.join("-"),
        category: "math", difficulty: level === 0 ? "easy" : (level === 1 ? "medium" : "hard"),
        text: text, options: shuffled.map(String), correctIndex: shuffled.indexOf(correct)
      });
    }
    return out;
  }

  /* ---------- شطرنج (Chess) ---------- */
  function chessOpp(c) { return c === "w" ? "b" : "w"; }
  function initChessBoard() {
    var b = [];
    for (var r = 0; r < 8; r++) b.push(new Array(8).fill(null));
    var back = ["r", "n", "b", "q", "k", "b", "n", "r"];
    for (var c = 0; c < 8; c++) {
      b[0][c] = { t: back[c], c: "w" };
      b[1][c] = { t: "p", c: "w" };

  }
  function chessCloneBoard(b) {
    return b.map(function (row) { return row.map(function (cell) { return cell ? { t: cell.t, c: cell.c } : null; }); });
  }
  function chessPieceMoves(b, r, c, st) {
    var p = b[r][c];
    if (!p) return [];
    var color = p.c, moves = [];
    function inB(x) { return x >= 0 && x < 8; }
    function push(tr, tc, flag) { if (inB(tr) && inB(tc)) moves.push({ r: tr, c: tc, flag: flag || null }); }
    function empty(tr, tc) { return inB(tr) && inB(tc) && !b[tr][tc]; }
    function enemy(tr, tc) { if (!inB(tr) || !inB(tc)) return false; var t = b[tr][tc]; return t && t.c !== color; }
    function enemyOrEmpty(tr, tc) { if (!inB(tr) || !inB(tc)) return false; var t = b[tr][tc]; return !t || t.c !== color; }
    if (p.t === "p") {
      var dir = color === "w" ? 1 : -1;
      var startRow = color === "w" ? 1 : 6;
      if (empty(r + dir, c)) {
        push(r + dir, c);
        if (r === startRow && empty(r + 2 * dir, c)) push(r + 2 * dir, c, "double");
      }
      [c - 1, c + 1].forEach(function (tc) {
        if (enemy(r + dir, tc)) push(r + dir, tc, "capture");
        else if (st.epTarget && st.epTarget.r === r + dir && st.epTarget.c === tc) push(r + dir, tc, "ep");
      });
    } else if (p.t === "n") {
      [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]].forEach(function (d) {
        if (enemyOrEmpty(r + d[0], c + d[1])) push(r + d[0], c + d[1]);
      });
    } else if (p.t === "b" || p.t === "r" || p.t === "q") {
      var dirs = [];
      if (p.t === "b" || p.t === "q") dirs = dirs.concat([[1, 1], [1, -1], [-1, 1], [-1, -1]]);
      if (p.t === "r" || p.t === "q") dirs = dirs.concat([[1, 0], [-1, 0], [0, 1], [0, -1]]);
      dirs.forEach(function (d) {
        var tr = r + d[0], tc = c + d[1];
        while (inB(tr) && inB(tc)) {
          if (empty(tr, tc)) { push(tr, tc); }
          else { if (enemy(tr, tc)) push(tr, tc); break; }
          tr += d[0]; tc += d[1];
        }
      });
    } else if (p.t === "k") {
      for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        if (enemyOrEmpty(r + dr, c + dc)) push(r + dr, c + dc);
      }
      var rights = st.castling;
      var rowBack = color === "w" ? 0 : 7;
      if (r === rowBack && c === 4) {
        var kSide = color === "w" ? rights.wk : rights.bk;
        var qSide = color === "w" ? rights.wq : rights.bq;
        if (kSide && empty(rowBack, 5) && empty(rowBack, 6) && b[rowBack][7] && b[rowBack][7].t === "r" && b[rowBack][7].c === color) {
          if (!chessIsAttacked(b, rowBack, 4, chessOpp(color)) && !chessIsAttacked(b, rowBack, 5, chessOpp(color)) && !chessIsAttacked(b, rowBack, 6, chessOpp(color))) push(rowBack, 6, "castleK");
        }
        if (qSide && empty(rowBack, 3) && empty(rowBack, 2) && empty(rowBack, 1) && b[rowBack][0] && b[rowBack][0].t === "r" && b[rowBack][0].c === color) {
          if (!chessIsAttacked(b, rowBack, 4, chessOpp(color)) && !chessIsAttacked(b, rowBack, 3, chessOpp(color)) && !chessIsAttacked(b, rowBack, 2, chessOpp(color))) push(rowBack, 2, "castleQ");

  function chessIsAttacked(b, r, c, byColor) {

      if (c + 1 < 8 && b[pr][c + 1] && b[pr][c + 1].t === "p" && b[pr][c + 1].c === byColor) return true;
    }
    var kd = [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]];
    for (var i = 0; i < kd.length; i++) {
      var tr = r + kd[i][0], tc = c + kd[i][1];
      if (tr >= 0 && tr < 8 && tc >= 0 && tc < 8) { var p = b[tr][tc]; if (p && p.t === "n" && p.c === byColor) return true; }
    }
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      var tr2 = r + dr, tc2 = c + dc;
      if (tr2 >= 0 && tr2 < 8 && tc2 >= 0 && tc2 < 8) { var p2 = b[tr2][tc2]; if (p2 && p2.t === "k" && p2.c === byColor) return true; }

      { d: [[1, 0], [-1, 0], [0, 1], [0, -1]], types: ["r", "q"] },
      { d: [[1, 1], [1, -1], [-1, 1], [-1, -1]], types: ["b", "q"] }

    for (var g = 0; g < groups.length; g++) {
      for (var j = 0; j < groups[g].d.length; j++) {

    b[to.r][to.c] = piece;
    if (to.flag === "castleK") { b[from.r][5] = b[from.r][7]; b[from.r][7] = null; }
    else if (to.flag === "castleQ") { b[from.r][3] = b[from.r][0]; b[from.r][0] = null; }

  function chessColorOf(pid) { return S.chess.colorOf[pid]; }
  function chessPlayerOfColor(color) {
    var pid = Object.keys(S.chess.colorOf).filter(function (k) { return S.chess.colorOf[k] === color; })[0];

  }
  function startChessGame() {
    S.chess = { board: initChessBoard(), turn: "w", castling: { wk: true, wq: true, bk: true, bq: true }, epTarget: null, selected: null, legalTargets: [], status: "playing", colorOf: {} };
    S.chess.colorOf[S.players[0].id] = "w";
    S.chess.colorOf[S.players[1].id] = "b";

  function makeChessMove(from, to) {
    var st = S.chess;
    var b = st.board;
    var piece = b[from.r][from.c];
    var captured = b[to.r][to.c];
    if (to.flag === "ep") b[from.r][to.c] = null;
    b[from.r][from.c] = null;
    b[to.r][to.c] = piece;
    if (to.flag === "castleK") { b[from.r][5] = b[from.r][7]; b[from.r][7] = null; }
    else if (to.flag === "castleQ") { b[from.r][3] = b[from.r][0]; b[from.r][0] = null; }
    if (piece.t === "p" && (to.r === 0 || to.r === 7)) piece.t = "q";
    if (piece.t === "k") { if (piece.c === "w") { st.castling.wk = false; st.castling.wq = false; } else { st.castling.bk = false; st.castling.bq = false; } }
    if (piece.t === "r") {
      if (from.r === 0 && from.c === 0) st.castling.wq = false;
      if (from.r === 0 && from.c === 7) st.castling.wk = false;
      if (from.r === 7 && from.c === 0) st.castling.bq = false;
      if (from.r === 7 && from.c === 7) st.castling.bk = false;
    }
    if (captured && captured.t === "r") {
      if (to.r === 0 && to.c === 0) st.castling.wq = false;
      if (to.r === 0 && to.c === 7) st.castling.wk = false;
      if (to.r === 7 && to.c === 0) st.castling.bq = false;
      if (to.r === 7 && to.c === 7) st.castling.bk = false;

    st.legalTargets = [];
    var oppColor = st.turn;
    var inCheck = chessInCheck(b, oppColor);

    if (inCheck && !hasMoves) {
      st.status = "checkmate";
      var winnerPid = Object.keys(st.colorOf).filter(function (k) { return st.colorOf[k] === piece.c; })[0];

      var target = st.legalTargets.filter(function (m) { return m.r === r && m.c === c; })[0];
      if (target) { makeChessMove(st.selected, target); return; }
      if (piece && piece.c === st.turn) { st.selected = { r: r, c: c }; st.legalTargets = chessLegalMoves(st, r, c); render(); return; }

  }
  var CHESS_GLYPH = { wk: "♔", wq: "♕", wr: "♖", wb: "♗", wn: "♘", wp: "♙", bk: "♚", bq: "♛", br: "♜", bb: "♝", bn: "♞", bp: "♟" };
  function renderChess() {

  /* ---------- سباق السيارات (Racing) — لعبة أركيد حقيقية على canvas ---------- */
  var RACE_LANES = 3;
  var RACE_TRAFFIC_COLORS = ["#d94f3d", "#3f7fd0", "#e0a63a", "#4caf50", "#9b59b6", "#16a085", "#e8743b"];
  var RACE_PLAYER_HEX = ["#e2574c", "#3f7fd0", "#4caf50", "#e0a63a", "#9b59b6", "#16a085", "#e8743b", "#5d6d7e"];
  var RACE_LEN_MAP = { 10: 1200, 15: 1800, 20: 2400, 25: 3000 };

  function generateRaceTrack(trackLen, rng) {
    var out = [];
    var d = 170;
    while (d < trackLen - 90) {
      var lane = Math.floor(rng() * RACE_LANES) % RACE_LANES;
      var isCoin = rng() < 0.24;
      out.push({
        d: d, lane: lane, kind: isCoin ? "coin" : "car",
        color: RACE_TRAFFIC_COLORS[Math.floor(rng() * RACE_TRAFFIC_COLORS.length) % RACE_TRAFFIC_COLORS.length]
      });
      /* بعد أول 450 متر أحيانًا تنزل سيارتان معًا — ويبقى دائمًا مسرب واحد فاضٍ على الأقل */
      if (!isCoin && d > 450 && rng() < 0.32) {
        var lane2 = (lane + 1 + Math.floor(rng() * (RACE_LANES - 1))) % RACE_LANES;
        if (lane2 !== lane) {
          out.push({
            d: d, lane: lane2, kind: "car",
            color: RACE_TRAFFIC_COLORS[Math.floor(rng() * RACE_TRAFFIC_COLORS.length) % RACE_TRAFFIC_COLORS.length]
          });
        }
      }
      d += 58 + rng() * 78;
    }
    return out;
  }

  function resetRaceRun(phase) {
    var r = S.racing;
    r.dist = 0; r.speed = 26; r.x = 0.5; r.vx = 0;
    r.timeMs = 0; r.crashes = 0; r.coins = 0;
    r.crashTimer = 0; r.countdown = 3.4;
    r.hits = {};
    r.keys = { left: false, right: false, gas: false, brake: false };
    r.phase = phase;
  }

  function startRacingGame(rng) {
    var seedRng = rng || Math.random;
    var trackLen = RACE_LEN_MAP[S.totalWanted] || 1800;
    S.racing = {
      trackLen: trackLen,
      obstacles: generateRaceTrack(trackLen, seedRng),
      playerTurnIdx: 0,
      results: {},
      lastRun: null,
      viewW: 340, viewH: 425,
      phase: "countdown"
    };
    resetRaceRun("countdown");
    S.scores = {};
    S.players.forEach(function (p) { S.scores[p.id] = 0; });
    S.screen = "board";
    render();
  }

  /* ---- حلقة اللعبة ---- */
  var raceRaf = null, raceLastTs = 0, raceCtx = null, raceCanvas = null;

  function stopRaceLoop() {
    if (raceRaf) { cancelAnimationFrame(raceRaf); raceRaf = null; }
    raceLastTs = 0;
  }
  function raceIsLive() {
    var r = S.racing;
    return !!(r && S.screen === "board" && S.gameType === "racing" &&
      (r.phase === "countdown" || r.phase === "running"));
  }
  function mountRaceCanvas() {
    if (!raceIsLive()) { stopRaceLoop(); return; }
    var r = S.racing;
    raceCanvas = document.getElementById("raceCanvas");
    if (!raceCanvas) { stopRaceLoop(); return; }
    var cssW = raceCanvas.clientWidth || raceCanvas.parentNode.clientWidth || 340;
    var cssH = Math.round(cssW * 1.25);
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    raceCanvas.width = Math.round(cssW * dpr);
    raceCanvas.height = Math.round(cssH * dpr);
    raceCanvas.style.height = cssH + "px";
    raceCtx = raceCanvas.getContext("2d");
    if (!raceCtx) return;
    raceCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    r.viewW = cssW; r.viewH = cssH;
    attachRaceControls();
    stopRaceLoop();
    raceRaf = requestAnimationFrame(raceFrame);
  }
  function attachRaceControls() {
    [["raceLeft", "left"], ["raceRight", "right"], ["raceGas", "gas"], ["raceBrake", "brake"]].forEach(function (pair) {
      var el = document.getElementById(pair[0]);
      if (!el) return;
      var key = pair[1];
      function on(e) { if (e) e.preventDefault(); if (!S.racing) return; S.racing.keys[key] = true; el.setAttribute("data-on", "1"); }
      function off(e) { if (e) e.preventDefault(); if (!S.racing) return; S.racing.keys[key] = false; el.setAttribute("data-on", "0"); }
      el.addEventListener("pointerdown", on);
      el.addEventListener("pointerup", off);
      el.addEventListener("pointerleave", off);
      el.addEventListener("pointercancel", off);
    });
  }
  function raceKeyDown(e) { raceKeyEvent(e, true); }
  function raceKeyUp(e) { raceKeyEvent(e, false); }
  function raceKeyEvent(e, down) {
    if (!S.racing || S.screen !== "board" || S.gameType !== "racing") return;
    var k = e.key, hit = true;
    if (k === "ArrowLeft" || k === "a" || k === "A") S.racing.keys.left = down;
    else if (k === "ArrowRight" || k === "d" || k === "D") S.racing.keys.right = down;
    else if (k === " " || k === "Spacebar" || k === "ArrowUp" || k === "w" || k === "W") S.racing.keys.gas = down;
    else if (k === "ArrowDown" || k === "s" || k === "S" || k === "b" || k === "B") S.racing.keys.brake = down;
    else hit = false;
    if (hit && e.preventDefault) e.preventDefault();
  }
  function raceFrame(ts) {
    var r = S.racing;
    if (!raceIsLive() || !raceCanvas || !document.body.contains(raceCanvas)) { stopRaceLoop(); return; }
    if (!raceLastTs) raceLastTs = ts;
    var dt = Math.min(0.05, (ts - raceLastTs) / 1000);
    raceLastTs = ts;
    if (r.phase === "countdown") {
      r.countdown -= dt;
      if (r.countdown <= 0) { r.phase = "running"; playSound("tick"); }
    } else if (r.phase === "running") {
      updateRace(dt);
    }
    drawRace();
    if (raceIsLive()) raceRaf = requestAnimationFrame(raceFrame);
    else raceRaf = null;
  }
  function updateRace(dt) {
    var r = S.racing;
    r.timeMs += dt * 1000;
    var MAXV = 74, CRUISE = 34, MINV = 14;
    if (r.crashTimer > 0) {
      r.crashTimer -= dt;
      r.speed += (15 - r.speed) * 5 * dt;
    } else if (r.keys.gas) {
      r.speed += 31 * dt;
    } else if (r.keys.brake) {
      r.speed -= 58 * dt;
    } else {
      r.speed += (CRUISE - r.speed) * 1.3 * dt;
    }
    r.speed = Math.max(MINV, Math.min(MAXV, r.speed));

    if (r.keys.left) r.vx -= 3.0 * dt;
    if (r.keys.right) r.vx += 3.0 * dt;
    if (!r.keys.left && !r.keys.right) r.vx *= Math.pow(0.02, dt);
    r.vx = Math.max(-1.35, Math.min(1.35, r.vx));
    r.x += r.vx * dt;
    if (r.x < 0.085) { r.x = 0.085; r.vx = 0; r.speed *= 0.965; }
    if (r.x > 0.915) { r.x = 0.915; r.vx = 0; r.speed *= 0.965; }

    r.dist += r.speed * dt;

    if (r.crashTimer <= 0) {
      for (var i = 0; i < r.obstacles.length; i++) {
        if (r.hits[i]) continue;
        var o = r.obstacles[i];
        if (Math.abs(o.d - r.dist) > 8) continue;
        var ox = (o.lane + 0.5) / RACE_LANES;
        var reach = o.kind === "coin" ? 0.115 : 0.145;
        if (Math.abs(ox - r.x) > reach) continue;
        r.hits[i] = true;
        if (o.kind === "coin") {
          r.coins += 1;
          r.speed = Math.min(MAXV, r.speed + 7);
          playSound("correct");
        } else {
          r.crashes += 1;
          r.crashTimer = 0.9;
          playSound("wrong");
          vibrate(90);
        }
      }
    }
    if (r.dist >= r.trackLen) finishPlayerRace();
  }

  /* ---- الرسم ---- */
  function shadeHex(hex, amt) {
    var h = String(hex).replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var num = parseInt(h, 16);
    if (!isFinite(num)) return hex;
    var rr = Math.max(0, Math.min(255, ((num >> 16) & 255) + amt));
    var gg = Math.max(0, Math.min(255, ((num >> 8) & 255) + amt));
    var bb = Math.max(0, Math.min(255, (num & 255) + amt));
    return "rgb(" + rr + "," + gg + "," + bb + ")";
  }
  function drawRaceCar(ctx, cx, cy, w, h, color, isPlayer) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = "rgba(0,0,0,.3)";
    roundRectPath(ctx, -w / 2 + 2, -h / 2 + 5, w, h, 7); ctx.fill();
    ctx.fillStyle = "#15161a";
    roundRectPath(ctx, -w / 2 - 3, -h * 0.34, 6, h * 0.22, 2.5); ctx.fill();
    roundRectPath(ctx, w / 2 - 3, -h * 0.34, 6, h * 0.22, 2.5); ctx.fill();
    roundRectPath(ctx, -w / 2 - 3, h * 0.13, 6, h * 0.24, 2.5); ctx.fill();
    roundRectPath(ctx, w / 2 - 3, h * 0.13, 6, h * 0.24, 2.5); ctx.fill();
    var grad = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    grad.addColorStop(0, shadeHex(color, -45));
    grad.addColorStop(0.45, color);
    grad.addColorStop(1, shadeHex(color, -60));
    ctx.fillStyle = grad;
    roundRectPath(ctx, -w / 2, -h / 2, w, h, 8); ctx.fill();
    ctx.fillStyle = shadeHex(color, 26);
    roundRectPath(ctx, -w * 0.30, -h * 0.10, w * 0.60, h * 0.34, 5); ctx.fill();
    ctx.fillStyle = "rgba(28,38,54,.88)";
    roundRectPath(ctx, -w * 0.32, -h * 0.33, w * 0.64, h * 0.20, 3.5); ctx.fill();
    ctx.fillStyle = "rgba(28,38,54,.72)";
    roundRectPath(ctx, -w * 0.29, h * 0.27, w * 0.58, h * 0.15, 3); ctx.fill();
    ctx.fillStyle = isPlayer ? "#fff6c9" : "#ffdada";
    roundRectPath(ctx, -w * 0.37, -h / 2 + 2, w * 0.22, 4, 2); ctx.fill();
    roundRectPath(ctx, w * 0.15, -h / 2 + 2, w * 0.22, 4, 2); ctx.fill();
    ctx.fillStyle = "#c0392b";
    roundRectPath(ctx, -w * 0.37, h / 2 - 5.5, w * 0.22, 3.5, 1.6); ctx.fill();
    roundRectPath(ctx, w * 0.15, h / 2 - 5.5, w * 0.22, 3.5, 1.6); ctx.fill();
    ctx.restore();
  }
  function drawRaceCoin(ctx, cx, cy, rad) {
    ctx.save();
    ctx.translate(cx, cy);
    var g = ctx.createRadialGradient(-rad * 0.3, -rad * 0.3, rad * 0.15, 0, 0, rad);
    g.addColorStop(0, "#fff3b0"); g.addColorStop(0.6, "#f2c14e"); g.addColorStop(1, "#c9962a");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, rad * 0.66, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#8a6516";
    ctx.font = "bold " + Math.round(rad * 1.15) + "px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("⚡", 0, 1);
    ctx.restore();
  }
  function drawRace() {
    var r = S.racing, ctx = raceCtx;
    if (!ctx || !r) return;
    var W = r.viewW, H = r.viewH;
    var viewMeters = 95;
    var mpp = H / viewMeters;
    var roadLeft = W * 0.09, roadW = W * 0.82, roadRight = roadLeft + roadW;
    var playerY = H * 0.76;
    var scroll = r.dist * mpp;

    ctx.fillStyle = "#3d5733";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#47653a";
    var gp = 30, goff = scroll % (gp * 2);
    for (var gy = -gp * 2 + goff; gy < H + gp; gy += gp * 2) {
      ctx.fillRect(0, gy, roadLeft, gp);
      ctx.fillRect(roadRight, gy + gp, W - roadRight, gp);
    }
    ctx.fillStyle = "#4b4b51";
    ctx.fillRect(roadLeft, 0, roadW, H);
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillRect(roadLeft - 4, 0, 4, H);
    ctx.fillRect(roadRight, 0, 4, H);
    var kp = 26, koff = scroll % (kp * 2);
    ctx.fillStyle = "#d8453a";
    for (var ky = -kp * 2 + koff; ky < H + kp; ky += kp * 2) {
      ctx.fillRect(roadLeft - 4, ky, 4, kp);
      ctx.fillRect(roadRight, ky + kp, 4, kp);
    }
    ctx.strokeStyle = "rgba(255,255,255,.8)";
    ctx.lineWidth = 3.5;
    ctx.setLineDash([20, 24]);
    ctx.lineDashOffset = -(scroll % 44);
    for (var l = 1; l < RACE_LANES; l++) {
      var lx = roadLeft + roadW * (l / RACE_LANES);
      ctx.beginPath(); ctx.moveTo(lx, -10); ctx.lineTo(lx, H + 10); ctx.stroke();
    }
    ctx.setLineDash([]);

    var finishY = playerY - (r.trackLen - r.dist) * mpp;
    if (finishY > -40 && finishY < H + 40) {
      var sq = roadW / 12;
      for (var fr = 0; fr < 2; fr++) {
        for (var fc = 0; fc < 12; fc++) {
          ctx.fillStyle = (fr + fc) % 2 === 0 ? "#ffffff" : "#1d1d1d";
          ctx.fillRect(roadLeft + fc * sq, finishY + fr * sq, sq, sq);
        }
      }
    }

    var carW = (roadW / RACE_LANES) * 0.56;
    var carH = carW * 1.85;
    for (var i = 0; i < r.obstacles.length; i++) {
      var o = r.obstacles[i];
      var sy = playerY - (o.d - r.dist) * mpp;
      if (sy < -70 || sy > H + 70) continue;
      var ox = roadLeft + roadW * ((o.lane + 0.5) / RACE_LANES);
      if (o.kind === "coin") {
        if (r.hits[i]) continue;
        drawRaceCoin(ctx, ox, sy, carW * 0.34);
      } else {
        drawRaceCar(ctx, ox, sy, carW, carH, o.color, false);
      }
    }

    var px = roadLeft + roadW * r.x;
    var wobble = r.crashTimer > 0 ? Math.sin(Date.now() / 26) * 5 : 0;
    var myHex = RACE_PLAYER_HEX[r.playerTurnIdx % RACE_PLAYER_HEX.length];
    if (r.keys.gas && r.crashTimer <= 0 && r.phase === "running") {
      var fl = ctx.createLinearGradient(0, playerY + carH / 2, 0, playerY + carH / 2 + 26);
      fl.addColorStop(0, "rgba(255,196,60,.85)");
      fl.addColorStop(1, "rgba(255,90,30,0)");
      ctx.fillStyle = fl;
      ctx.beginPath();
      ctx.moveTo(px - carW * 0.26, playerY + carH / 2);
      ctx.lineTo(px + carW * 0.26, playerY + carH / 2);
      ctx.lineTo(px, playerY + carH / 2 + 24 + Math.random() * 10);
      ctx.closePath(); ctx.fill();
    }
    drawRaceCar(ctx, px + wobble, playerY, carW, carH, myHex, true);

    if (r.crashTimer > 0) {
      ctx.fillStyle = "rgba(210,40,30," + Math.min(0.42, r.crashTimer * 0.5) + ")";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.font = "700 26px system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("💥", px, playerY - carH * 0.6);
    }
    if (r.phase === "countdown") {
      ctx.fillStyle = "rgba(10,10,15,.5)";
      ctx.fillRect(0, 0, W, H);
      var n = Math.ceil(r.countdown - 0.4);
      var label = n > 0 ? String(n) : "انطلق!";
      ctx.fillStyle = "#ffd76a";
      ctx.font = "700 " + (n > 0 ? 84 : 46) + "px 'Lalezar', system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(label, W / 2, H / 2);
      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.font = "600 14px system-ui, sans-serif";
      ctx.fillText("استعد… أمسك دواسة البنزين", W / 2, H / 2 + 62);
    }
    updateRaceHud();
  }
  function updateRaceHud() {
    var r = S.racing;
    if (!r) return;
    var el = document.getElementById("raceSpeed");
    if (el) el.textContent = Math.round(r.speed * 3.6);
    el = document.getElementById("raceTime");
    if (el) el.textContent = (r.timeMs / 1000).toFixed(1);

  }

  /* ---- نهاية الجولة ---- */
  function finishPlayerRace() {
    var r = S.racing;
    r.phase = "result";
    stopRaceLoop();
    var p = S.players[r.playerTurnIdx];
    var finalMs = Math.max(1000, r.timeMs - r.coins * 400);
    r.results[p.id] = { ms: finalMs, raw: r.timeMs, coins: r.coins, crashes: r.crashes };
    r.lastRun = { name: p.name, ms: finalMs, raw: r.timeMs, coins: r.coins, crashes: r.crashes };
    S.scores[p.id] = Math.max(50, Math.round(60000000 / (finalMs + 4000)));
    playSound("win");

  }
  function continueRaceHandoff() {
    var r = S.racing;
    if (!r) return;
    r.playerTurnIdx += 1;

    resetRaceRun("countdown");

  }
  function finalizeRacingGame() {
    stopRaceLoop();
    S.screen = "winner";
    if (S.playMode === "parallel" && S.players[0]) {

    var topScore = Math.max.apply(null, entries.map(function (e) { return e.score; }));
    awardPoints(entries.map(function (e) {

  function inviteUrl(code) {

  function createParallelCode() {

    if (S.gameType === "trivia") {

  function beginParallelGame() {

    if (!decoded) { flashWarn("حدث خطأ في إنشاء الرمز، حاول مجددًا"); S.parallelPhase = "create"; render(); return; }
    startSoloGame(decoded.gameType, decoded.cats, decoded.count, decoded.seed, S.pendingSolo.name);

  function startSoloGame(gameType, cats, count, seed, name) {

    S.players = [player];
    S.compareEntries = [];
    if (gameType === "racing") {
      S.totalWanted = count;
      startRacingGame(mulberry32(seed));
      return;
    }
    var pool = buildParallelPool(gameType, cats, count, seed);
    if (!pool.length) { flashWarn("لا توجد أسئلة كافية لهذا الرمز"); return; }

    S.streaks[player.id] = 0;

  function enterQuestion() {
    S.hiddenOptions = [];

  function runTimerTick() {
    clearInterval(S.timer.handle);
    S.timer.handle = setInterval(function () {
      if (S.paused) return;
      S.timer.remainMs -= 100;
      if (S.timer.remainMs <= 0) {
        S.timer.remainMs = 0;
        clearInterval(S.timer.handle);
        selectAnswer(-1);
        return;
      }
      if (Math.round(S.timer.remainMs / 100) % 10 === 0) updateTimerUI();
      if (S.timer.remainMs <= 3000 && Math.round(S.timer.remainMs / 100) % 10 === 0) playSound("tick");
    }, 100);
    updateTimerUI();
  }
  function startTimer(diff) {
    var totalMs = DIFF_TIME[diff] * 1000;
    S.timer.totalMs = totalMs;
    S.timer.remainMs = totalMs;
    S.paused = false;
    runTimerTick();
  }
  function togglePause() {
    if (S.screen !== "question") return;
    S.paused = !S.paused;
    if (S.paused) { clearInterval(S.timer.handle); } else { runTimerTick(); }
    render();
  }
  function updateTimerUI() {
    var ring = document.getElementById("timerRing");
    var num = document.getElementById("timerNum");
    if (!ring || !num) return;
    var frac = S.timer.remainMs / S.timer.totalMs;
    var circumference = 2 * Math.PI * 38;
    ring.style.strokeDashoffset = String(circumference * (1 - frac));
    num.textContent = String(Math.ceil(S.timer.remainMs / 1000));
  }

  function selectAnswer(idx) {
    if (S.screen !== "question" || S.paused) return;
    if (idx >= 0 && S.hiddenOptions.indexOf(idx) !== -1) return;
    clearInterval(S.timer.handle);
    var q = currentQuestion();
    var correct = idx === q.correctIndex;
    var frac = S.timer.totalMs ? S.timer.remainMs / S.timer.totalMs : 0;
    var timeMs = S.timer.totalMs - S.timer.remainMs;
    var base = DIFF_POINTS[q.difficulty] || 100;
    var pid = currentPlayer().id;
    var streakBonus = 0;
    var points = 0;
    if (correct) {
      S.streaks[pid] = (S.streaks[pid] || 0) + 1;
      if (S.streaks[pid] > (S.bestStreak[pid] || 0)) S.bestStreak[pid] = S.streaks[pid];
      streakBonus = Math.min(S.streaks[pid] - 1, 5) * 15;
      points = base + Math.round(base * 0.5 * frac) + streakBonus;
      if (S.activePower.double) points *= 2;
    } else {
      S.streaks[pid] = 0;
    }
    S.scores[pid] = (S.scores[pid] || 0) + points;
    S.answerLog.push({ playerId: pid, correct: correct, points: points, timeMs: timeMs, streak: S.streaks[pid] });
    S.lastAnswer = { chosenIndex: idx, correct: correct, points: points, streakBonus: streakBonus, doubled: S.activePower.double };
    S.screen = "reveal";
    render();
    saveGameState();
    playSound(correct ? "correct" : "wrong");
    vibrate(correct ? 30 : [40, 40, 40]);
    setTimeout(afterReveal, 1900);
  }

  function skipQuestion() {
    if (S.screen !== "question" || S.paused) return;
    clearInterval(S.timer.handle);
    var pid = currentPlayer().id;
    S.streaks[pid] = 0;
    S.answerLog.push({ playerId: pid, correct: false, points: 0, timeMs: null, streak: 0, skipped: true });
    S.lastAnswer = { chosenIndex: -2, correct: false, points: 0, skipped: true };
    S.screen = "reveal";
    render();
    saveGameState();
    setTimeout(afterReveal, 1200);
  }

  function activateFifty() {
    if (S.screen !== "question" || S.paused) return;
    var q = currentQuestion();
    if (q.options.length < 4) return;
    var pid = currentPlayer().id;
    var pu = S.powerups[pid] || { fifty: false, double: false };
    if (pu.fifty) return;
    pu.fifty = true;
    S.powerups[pid] = pu;
    var wrongIdx = [0, 1, 2, 3].filter(function (i) { return i !== q.correctIndex; });
    S.hiddenOptions = shuffle(wrongIdx).slice(0, 2);
    render();
  }
  function activateDouble() {
    if (S.screen !== "question" || S.paused) return;
    var pid = currentPlayer().id;
    var pu = S.powerups[pid] || { fifty: false, double: false };

    pu.double = true;
    S.powerups[pid] = pu;
    S.activePower.double = true;
    render();
  }

  function afterReveal() {
    var wasLast = S.idx >= S.pool.length - 1;
    var endOfRound = S.players.length > 1 && (S.idx + 1) % S.players.length === 0;
    S.idx += 1;
    if (wasLast) {
      S.screen = "winner";
      if (S.playMode === "parallel" && S.players[0]) {
        S.compareEntries = [{ name: S.players[0].name, score: S.scores[S.players[0].id] || 0 }];
      }
      render();
      playSound("win");
      startConfetti();
      var entries = S.players.map(function (p) { return { name: p.name, score: S.scores[p.id] || 0 }; });
      pushToHOF(entries);
      var topScore = Math.max.apply(null, entries.map(function (e) { return e.score; }));
      awardPoints(entries.map(function (e) {
        return { name: e.name, points: Math.round(e.score / 10) + (topScore > 0 && e.score === topScore ? 25 : 0) };
      }));
      clearGameState();
      return;
    }
    if (endOfRound) {
      S.screen = "roundbreak";
      render();
      saveGameState();
      return;
    }
    enterQuestion();
  }

  function fallbackCopy(text, done) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch (e) {}
  }
  function copyGameCode() {

    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
      } else {
        fallbackCopy(text, done);
      }
    } catch (e) { fallbackCopy(text, done); }
  }

  /* ---------- confetti ---------- */
  var confettiCanvas = document.getElementById("confetti");
  var cctx = confettiCanvas.getContext("2d");
  var confettiParts = [];
  var confettiRAF = null;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function resizeConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeConfetti);
  resizeConfetti();
  var confColors = ["oklch(70% 0.15 50)", "oklch(65% 0.18 25)", "oklch(60% 0.1 130)", "oklch(62% 0.1 250)"];
  function startConfetti() {
    if (reduceMotion) return;
    confettiParts = [];
    for (var i = 0; i < 90; i++) {
      confettiParts.push({
        x: Math.random() * confettiCanvas.width,
        y: -20 - Math.random() * confettiCanvas.height * 0.5,
        w: 6 + Math.random() * 6,
        h: 6 + Math.random() * 10,
        rot: Math.random() * 360,
        vRot: (Math.random() - 0.5) * 10,
        vy: 2 + Math.random() * 2.5,
        vx: (Math.random() - 0.5) * 1.6,
        color: confColors[i % confColors.length]
      });
    }
    var t0 = performance.now();
    function tick(t) {
      cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      var alive = false;
      confettiParts.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.rot += p.vRot;
        if (p.y < confettiCanvas.height + 20) alive = true;
        cctx.save();
        cctx.translate(p.x, p.y);
        cctx.rotate(p.rot * Math.PI / 180);
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        cctx.restore();
      });
      if (alive && t - t0 < 6000) {
        confettiRAF = requestAnimationFrame(tick);
      } else {
        cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }
    confettiRAF = requestAnimationFrame(tick);
  }
  function stopConfetti() {
    if (confettiRAF) cancelAnimationFrame(confettiRAF);
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  }

  function scorebar() {

  function timerSvg() {

      '<text id="timerNum" x="44" y="51" text-anchor="middle" class="timer-num">0</text>' +

  var ANS_COLORS = ["var(--ans-a)", "var(--ans-b)", "var(--ans-c)", "var(--ans-d)"];

  function renderQuestion(revealing) {
    var q = currentQuestion();
    var player = currentPlayer();
    var pu = S.powerups[player.id] || { fifty: false, double: false };
    var streak = S.streaks[player.id] || 0;
    var html = "";
    html += topbar(true);

    var progressPct = Math.round((S.idx / S.pool.length) * 100);
    html += '<div class="game-progress"><div class="game-progress-fill" style="width:' + progressPct + '%"></div></div>';

    html += '<div class="qmeta"><span class="badge">' + CATS[q.category] + " · " + DIFF_LABEL[q.difficulty] + '</span><span class="qcount">سؤال ' + (S.idx + 1) + ' من ' + S.pool.length + "</span></div>";
    html += '<div class="turn-strip"><div class="avatar" style="background:' + player.color + '">' + esc(initials(player.name)) + '</div><div style="flex:1"><div class="label">دور ال' + unitWord() + '</div><div class="pname">' + esc(player.name) + "</div></div>";
    if (streak >= 2 && !revealing) {
      html += '<span class="streak-badge">' + svgIcon("flame") + "×" + streak + '</span>';
    }
    html += "</div>";

    if (!revealing) {
      html += '<div class="power-row">';
      if (q.options.length >= 4) {
        html += '<button class="power-btn" data-used="' + (pu.fifty ? 1 : 0) + '" onclick="Game.activateFifty()">50/50</button>';
      }
      html += '<button class="power-btn" data-used="' + (pu.double ? 1 : 0) + '" data-active="' + (S.activePower.double ? 1 : 0) + '" onclick="Game.activateDouble()">نقاط ×2</button>';
      html += '<button class="power-btn" onclick="Game.togglePause()" style="display:flex;align-items:center;gap:6px">' + svgIcon(S.paused ? "play" : "pause") + (S.paused ? "استمرار" : "إيقاف") + '</button>';
      html += '</div>';
    }

    if (S.paused) {
      html += '<div class="reveal-banner" data-ok="0" style="background:var(--surface);color:var(--text-muted)">الجولة متوقفة مؤقتًا — اضغط ' + svgIcon("play") + ' للاستمرار</div>';
    }

    html += timerSvg();
    html += '<div class="card question-card"><div class="question-text">' + esc(q.text) + "</div></div>";

    var chosen = S.lastAnswer ? S.lastAnswer.chosenIndex : -2;
    html += '<div class="answers-grid">' + q.options.map(function (opt, i) {
      var attrs = 'style="background:' + ANS_COLORS[i] + '"';
      var hidden = S.hiddenOptions.indexOf(i) !== -1;
      if (revealing) {
        if (i === q.correctIndex) attrs += ' data-correct="1"';
        else if (i === chosen) attrs += ' data-wrong="1"';
        else attrs += ' data-dim="1"';
      } else if (hidden) {
        attrs += ' data-hidden="1"';
      }
      var disabled = (revealing || hidden || S.paused) ? "disabled" : "";
      return '<button class="answer-btn" ' + attrs + " " + disabled + ' onclick="Game.selectAnswer(' + i + ')">' + esc(opt) + "</button>";
    }).join("") + "</div>";

    if (!revealing) {
      html += '<button class="btn btn-ghost" style="padding:8px 14px;font-size:12px;align-self:center;margin:0 auto" onclick="Game.skipQuestion()">تخطي السؤال</button>';
    }

    if (revealing && S.lastAnswer) {
      var ok = S.lastAnswer.correct;
      var extra = "";
      if (ok && S.lastAnswer.streakBonus) extra += " (سلسلة +" + S.lastAnswer.streakBonus + ")";
      if (ok && S.lastAnswer.doubled) extra += " ×2";
      var isWyr = q.category === "wyr";
      var wrongText = S.lastAnswer.skipped ? "تم تخطي السؤال" : (S.lastAnswer.chosenIndex === -1 ? "انتهى الوقت" : (isWyr ? "اخترت خيارًا مختلفًا هالمرة" : "إجابة غير صحيحة"));
      var okText = (isWyr ? "متل أغلب اللاعبين! +" : "إجابة صحيحة! +") + S.lastAnswer.points + " نقطة" + extra;
      html += '<div class="reveal-banner" data-ok="' + (ok ? 1 : 0) + '">' + (ok ? okText : wrongText) + "</div>";
    }

    html += scorebar();
    return html;
  }

  function rankedPlayers() {
    return S.players.slice().sort(function (a, b) { return (S.scores[b.id] || 0) - (S.scores[a.id] || 0); });
  }

  function playerName(pid) {
    var p = S.players.filter(function (x) { return x.id === pid; })[0];
    return p ? p.name : "";
  }

  function computeStats() {
    var log = S.answerLog;
    var fastest = null;
    log.forEach(function (e) {
      if (e.correct && (!fastest || e.timeMs < fastest.timeMs)) fastest = e;
    });
    var acc = {};
    log.forEach(function (e) {
      var a = acc[e.playerId] || { correct: 0, total: 0 };
      a.total++;
      if (e.correct) a.correct++;
      acc[e.playerId] = a;
    });
    var bestAcc = null;
    Object.keys(acc).forEach(function (pid) {
      var a = acc[pid];
      var pct = a.total ? a.correct / a.total : 0;
      if (a.total >= 2 && (!bestAcc || pct > bestAcc.pct)) bestAcc = { playerId: pid, pct: pct };
    });
    var bestStreakPid = null, bestStreakVal = 0;
    Object.keys(S.bestStreak).forEach(function (pid) {
      if (S.bestStreak[pid] > bestStreakVal) { bestStreakVal = S.bestStreak[pid]; bestStreakPid = pid; }
    });
    return { fastest: fastest, bestAcc: bestAcc, bestStreak: bestStreakVal >= 2 ? { playerId: bestStreakPid, val: bestStreakVal } : null };
  }

  function renderRoundbreak() {
    var ranked = rankedPlayers();

    html += topbar(true);

      return '<div class="rank-row" data-lead="' + (i === 0 ? 1 : 0) + '"><span class="rank-num">' + (i + 1) + '</span><div class="avatar" style="background:' + p.color + '">' + esc(initials(p.name)) + '</div><span class="name">' + esc(p.name) + '</span><span class="pts">' + (S.scores[p.id] || 0) + "</span></div>";
    }).join("") + "</div>";

    var sorted = S.compareEntries.slice().sort(function (a, b) { return b.score - a.score; });

    html += '<div class="opt-row"><input id="cmpName" class="text-input" placeholder="الاسم" maxlength="18"><input id="cmpScore" class="text-input" placeholder="النقاط" inputmode="numeric" style="max-width:100px"></div>';

  function renderWinner() {
    var ranked = rankedPlayers();
    var top = ranked[0];
    var stats = computeStats();
    var isParallel = S.playMode === "parallel";
    var html = "";
    html += topbar(true);
    html += '<div class="hero" style="padding-top:14px">';
    html += '<div class="hero-mark" style="width:84px;height:84px;border-radius:26px">' + '<span style="color:var(--accent-contrast)">' + svgIcon("trophy") + "</span></div>";
    html += '<div class="hero-sub" style="margin-top:8px">' + (isParallel ? "نتيجتك النهائية" : (S.mode === "teams" ? "الفريق الفائز" : "الفائز") + " في " + (GAME_TYPES[S.gameType] ? GAME_TYPES[S.gameType].short : "اللعبة")) + "</div>";
    html += '<div class="winner-name">' + esc(top ? top.name : "") + '</div>';
    html += '<div class="winner-pts">' + (top ? S.scores[top.id] : 0) + " نقطة</div>";
    if (top) html += '<div class="footnote" style="text-align:center">🏆 مجموع نقاط ' + esc(top.name) + ' مدى الحياة: ' + getPoints(top.name) + '</div>';
    html += "</div>";

    if (isParallel) {
      html += '<div class="card" style="text-align:center"><div class="section-label" style="justify-content:center">رمز اللعبة</div><div style="font-family:\'Lalezar\',system-ui;font-size:26px;letter-spacing:2px;color:var(--accent-strong)">' + esc(S.gameCode) + "</div></div>";
    } else {
      html += '<div style="display:flex;flex-direction:column;gap:10px">' + ranked.map(function (p, i) {
        return '<div class="rank-row" data-lead="' + (i === 0 ? 1 : 0) + '"><span class="rank-num">' + (i + 1) + '</span><div class="avatar" style="background:' + p.color + '">' + esc(initials(p.name)) + '</div><span class="name">' + esc(p.name) + '</span><span class="pts">' + (S.scores[p.id] || 0) + "</span></div>";
      }).join("") + "</div>";
    }

    if (stats.fastest || stats.bestAcc || stats.bestStreak) {
      html += '<div class="section-label" style="margin-top:2px">إحصائيات الجولة</div>';
      html += '<div class="stats-row">';
      if (stats.fastest) {
        html += '<div class="stat-tile"><div class="stat-label">أسرع إجابة</div><div class="stat-value">' + (stats.fastest.timeMs / 1000).toFixed(1) + 'ث</div><div class="stat-name">' + esc(playerName(stats.fastest.playerId)) + '</div></div>';
      }
      if (stats.bestAcc) {
        html += '<div class="stat-tile"><div class="stat-label">الأعلى دقة</div><div class="stat-value">' + Math.round(stats.bestAcc.pct * 100) + '%</div><div class="stat-name">' + esc(playerName(stats.bestAcc.playerId)) + '</div></div>';
      }
      if (stats.bestStreak) {
        html += '<div class="stat-tile"><div class="stat-label">أطول سلسلة</div><div class="stat-value">×' + stats.bestStreak.val + '</div><div class="stat-name">' + esc(playerName(stats.bestStreak.playerId)) + '</div></div>';
      }
      html += '</div>';
    }

    if (isParallel) html += renderCompareTool();

    html += '<button class="btn btn-primary btn-block" onclick="Game.' + (isParallel ? "replayParallel" : "startGame") + '()">' + (isParallel ? "العب بهذا الرمز مرة أخرى" : "العب مرة أخرى (نفس الإعدادات)") + "</button>";
    html += '<button class="btn btn-ghost btn-block" onclick="Game.shareResults()" style="display:flex;align-items:center;justify-content:center;gap:8px">' + svgIcon("copy") + (S.shareCopied ? "تم النسخ!" : (isParallel ? "نسخ نتيجتي والرمز" : "نسخ النتيجة للمشاركة")) + "</button>";
    html += '<button class="btn btn-ghost btn-block" onclick="Game.newGame()">تعديل الإعدادات / لاعبون جدد</button>';
    return html;
  }

  function render() {
    var html = "";
    if (S.screen === "setup") html = renderSetup();
    else if (S.screen === "question") html = renderQuestion(false);
    else if (S.screen === "reveal") html = renderQuestion(true);
    else if (S.screen === "roundbreak") html = renderRoundbreak();
    else if (S.screen === "board") html = renderBoard();
    else if (S.screen === "winner") html = renderWinner();
    if (S.showAbout) html += aboutModal();
    app.innerHTML = html;
    if (S.screen === "question") updateTimerUI();
    if (S.screen === "board" && S.gameType === "racing") mountRaceCanvas();
    else stopRaceLoop();
    app.classList.remove("fade-in");
    void app.offsetWidth;
    app.classList.add("fade-in");
  }

    copyGameCode: copyGameCode,
    resetUsedQuestions: resetUsedQuestions,
    addCompareEntry: addCompareEntry,
    removeCompareEntry: removeCompareEntry,
    setGameType: setGameType,
    rollSnakesDice: rollSnakesDice,
    xoClick: xoClickCell,
    selectSequenceCard: selectSequenceCard,
    playSequenceCell: playSequenceCell,
    chessClick: chessClickCell,
    continueRaceHandoff: continueRaceHandoff,
    setXoAiLevel: setXoAiLevel,
    installApp: installApp
  };

  window.addEventListener("keydown", raceKeyDown);
  window.addEventListener("keyup", raceKeyUp);
  window.addEventListener("blur", function () {
    if (S.racing && S.racing.keys) S.racing.keys = { left: false, right: false, gas: false, brake: false };
  });

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    S.canInstall = true;
    render();
  });
  window.addEventListener("appinstalled", function () {
    S.canInstall = false;
    deferredInstallPrompt = null;
    render();
  });
  setupPWA();

  document.addEventListener("keydown", function (e) {
    if (S.screen !== "question" || S.paused) return;
    var active = document.activeElement;
    if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) return;
    var map = { "1": 0, "2": 1, "3": 2, "4": 3 };
    if (map.hasOwnProperty(e.key) && S.hiddenOptions.indexOf(map[e.key]) === -1) {
      selectAnswer(map[e.key]);
    }
  });

  window.addEventListener("beforeunload", function (e) {
    if (S.screen === "question" || S.screen === "reveal" || S.screen === "roundbreak" || S.screen === "board") {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      saveGameState();
      if (S.screen === "question" && !S.paused) {
        S.paused = true;
        clearInterval(S.timer.handle);
        render();
      }
    }
  });

  (function tryResume() {
    var saved = loadGameState();
    var mcqResumable = saved && saved.players && saved.players.length && saved.pool && saved.pool.length &&
      (saved.screen === "question" || saved.screen === "reveal" || saved.screen === "roundbreak");
    var boardResumable = saved && saved.players && saved.players.length && saved.screen === "board" &&
      ["snakes", "sequence", "chess", "xo"].indexOf(saved.gameType) !== -1 && saved[saved.gameType];
    var resumable = mcqResumable || boardResumable;

    if (!resumable) {
      try {
        var m = /[#&]j=([0-9A-Za-z]+)/.exec(location.hash);
        if (m) {
          S.playMode = "parallel";
          S.parallelPhase = "join";
          S.prefillCode = m[1].toUpperCase();
        }
      } catch (e) {}
      render();
      return;
    }

    S.mode = saved.mode || "players";
    S.gameType = saved.gameType || "trivia";
    S.players = saved.players;
    S.cats = saved.cats || S.cats;
    S.totalWanted = saved.totalWanted || S.totalWanted;
    S.playMode = saved.playMode || "local";
    S.gameCode = saved.gameCode || null;
    S.compareEntries = saved.compareEntries || [];

    if (boardResumable) {
      S.snakes = saved.snakes || null;
      S.sequence = saved.sequence || null;
      S.chess = saved.chess || null;
      S.xo = saved.xo || null;
      if (S.snakes) { S.snakes.rolling = false; S.snakes.anim = null; }
      if (S.xo) S.xo.busy = false;
      S.screen = "board";
      render();
      return;
    }

    S.pool = saved.pool;
    S.idx = saved.idx || 0;
    S.scores = saved.scores || {};
    S.streaks = saved.streaks || {};
    S.bestStreak = saved.bestStreak || {};
    S.powerups = saved.powerups || {};
    S.answerLog = saved.answerLog || [];
    if (S.idx >= S.pool.length) { S.screen = "setup"; render(); return; }
    if (saved.screen === "roundbreak") {
      S.screen = "roundbreak";
      render();
    } else {
      enterQuestion();
    }
  })();
})();

</script>
</body>
</html>
